<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>عمالقة الصمت — لوحة التحكم</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, 'Segoe UI', Tahoma, sans-serif; background: #0a1020; color: #e8ecf5; min-height: 100vh; padding: 16px; }
  header { text-align: center; margin-bottom: 20px; padding: 12px; }
  header h1 { font-size: 22px; color: #a78bfa; margin-bottom: 6px; }
  header p { color: #94a3b8; font-size: 12px; }
  .tabs { display: flex; gap: 6px; justify-content: center; margin-bottom: 16px; flex-wrap: wrap; }
  .tab { padding: 8px 14px; background: #1e293b; border-radius: 10px; color: #cbd5e1; cursor: pointer; border: 2px solid transparent; font-size: 13px; font-weight: 500; }
  .tab.active { background: #312e81; color: #e0e7ff; border-color: #a78bfa; }
  .panel { display: none; }
  .panel.active { display: block; }
  .card { background: #1e293b; border-radius: 14px; padding: 16px; margin-bottom: 14px; border: 1px solid #334155; }
  .card h2 { color: #a78bfa; font-size: 15px; margin-bottom: 10px; }
  .stat { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #334155; font-size: 13px; }
  .stat:last-child { border-bottom: none; }
  .stat .label { color: #94a3b8; }
  .stat .value { color: #e0e7ff; font-weight: 600; }
  .item { padding: 10px; background: #0f172a; border-radius: 10px; margin-bottom: 8px; }
  .item .meta { color: #a78bfa; font-size: 11px; margin-bottom: 4px; }
  .item .body { color: #e0e7ff; font-size: 13px; line-height: 1.5; }
  .empty { text-align: center; padding: 20px; color: #64748b; font-size: 13px; }
  .error { background: #7f1d1d; padding: 12px; border-radius: 10px; color: #fecaca; margin-bottom: 12px; font-size: 12px; }
  .ok { color: #4ade80; } .warn { color: #fbbf24; } .bad { color: #f87171; }
  #msg-body { width: 100%; min-height: 200px; padding: 14px; background: #0f172a; color: #e0e7ff; border: 2px solid #334155; border-radius: 12px; font-size: 15px; font-family: inherit; resize: vertical; line-height: 1.6; }
  #msg-body:focus { border-color: #a78bfa; outline: none; }
  .btn-primary { display: block; width: 100%; padding: 14px; background: #312e81; color: #e0e7ff; border: none; border-radius: 12px; font-size: 15px; cursor: pointer; margin-top: 10px; font-weight: 600; }
  .btn-primary:active { background: #4338ca; }
  .reload { display: block; width: 100%; padding: 14px; background: #1e40af; color: #e0e7ff; border: none; border-radius: 12px; font-size: 15px; cursor: pointer; margin-top: 12px; font-weight: 600; }
  .live-item { padding: 10px 12px; background: #0f172a; border-radius: 10px; margin-bottom: 8px; border-right: 3px solid #a78bfa; }
  .live-meta { font-size: 11px; margin-bottom: 4px; font-weight: 600; }
  .live-body { color: #e0e7ff; font-size: 13px; line-height: 1.5; white-space: pre-wrap; }
  .bal-row { text-align: center; padding: 12px; background: #0f172a; border-radius: 12px; margin-bottom: 12px; }
  .bal-num { font-size: 32px; font-weight: 800; color: #4ade80; }
  .bal-sym { font-size: 14px; color: #94a3b8; margin-right: 8px; font-weight: 600; }
  .addr-row { background: #0f172a; padding: 12px; border-radius: 10px; font-family: monospace; font-size: 11px; word-break: break-all; color: #a5b4fc; line-height: 1.6; margin-bottom: 10px; }
  .btn-copy { display: block; width: 100%; padding: 12px; background: #312e81; color: #e0e7ff; border: none; border-radius: 10px; font-size: 14px; cursor: pointer; font-weight: 600; }
</style>
</head>
<body>
<header>
  <h1>⚡ عمالقة الصمت</h1>
  <p>لوحة تحكم الفريق — Silent Giants</p>
</header>

<div id="error" class="error" style="display:none"></div>

<div class="tabs">
  <div class="tab active" data-tab="main">الرئيسية</div>
  <div class="tab" data-tab="team">غرفة الفريق</div>
  <div class="tab" data-tab="tasks">المهام</div>
  <div class="tab" data-tab="wallets">💼 المحافظ</div>
  <div class="tab" data-tab="notifications">الإشعارات</div>
</div>

<div class="panel active" id="panel-main">
  <div class="card">
    <h2>📊 حالة النظام</h2>
    <div id="system-stats">جاري التحميل...</div>
  </div>
  <div class="card">
    <h2>👥 الوكلاء</h2>
    <div id="agents-list">جاري التحميل...</div>
  </div>
</div>

<div class="panel" id="panel-team">
  <div class="card">
    <h2>📤 إرسال أمر للفريق</h2>
    <div style="margin-bottom: 10px;">
      <label style="color:#94a3b8; font-size:12px; display:block; margin-bottom:6px;">إلى:</label>
      <select id="msg-recipient" style="width:100%; padding:10px; background:#0f172a; color:#e0e7ff; border:1px solid #334155; border-radius:10px; font-size:14px;">
        <option value="all">الفريق الكامل</option>
        <option value="aurora">أورورا (المنسق)</option>
        <option value="planner">المخطط</option>
        <option value="executor">المنفذ</option>
        <option value="reviewer">المراجع</option>
        <option value="scout">المستخبر</option>
      </select>
    </div>
    <textarea id="msg-body" placeholder="اكتب الأمر بالتفصيل..."></textarea>
    <button id="send-btn" class="btn-primary">📤 إرسال الأمر للفريق</button>
    <div id="send-status" style="text-align:center; margin-top:10px; font-size:13px; color:#94a3b8;"></div>
  </div>

  <div class="card">
    <h2>📺 السجل الحي</h2>
    <div id="live-log">جاري التحميل...</div>
  </div>
</div>

<div class="panel" id="panel-tasks">
  <div class="card">
    <h2>📋 المهام النشطة</h2>
    <div id="tasks-list">جاري التحميل...</div>
  </div>
</div>

<div class="panel" id="panel-wallets">
  <div id="wallets-output"><div class="card"><div class="empty">⏳ جاري التحميل...</div></div></div>
</div>

<div class="panel" id="panel-notifications">
  <div class="card">
    <h2>🔔 الإشعارات</h2>
    <div id="notifications-list">جاري التحميل...</div>
  </div>
</div>

<button id="refresh-btn" class="reload">🔄 تحديث البيانات</button>

<script src="/dashboard.js?v=11"></script>

<script>
// ═══════════════════════════════════════════════════════════
// 1) زر التحديث — التقاط قبل dashboard.js
// ═══════════════════════════════════════════════════════════
(function () {
  document.addEventListener('click', function (ev) {
    var el = ev.target;
    while (el && el !== document.body) {
      if (el.id === 'refresh-btn') {
        ev.preventDefault();
        ev.stopPropagation();
        ev.stopImmediatePropagation();
        window.location.reload();
        return false;
      }
      el = el.parentElement;
    }
  }, true); // capture = true
})();

// ═══════════════════════════════════════════════════════════
// 2) المحافظ — كود مستقل
// ═══════════════════════════════════════════════════════════
(function () {
  var KEY = '8cdQ7WY9SvAGxe6SfFPlngj0_UbX6Cr';

  function copyHandler() {
    var addr = this.getAttribute('data-addr');
    var self = this;
    var oldText = self.textContent;
    function done() {
      self.textContent = '✅ تم النسخ';
      setTimeout(function () { self.textContent = oldText; }, 1500);
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(addr).then(done).catch(function () { alert(addr); });
    } else {
      var ta = document.createElement('textarea');
      ta.value = addr;
      ta.style.position = 'fixed';
      ta.style.top = '-1000px';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); done(); } catch (e) { alert(addr); }
      document.body.removeChild(ta);
    }
  }

  window.__loadWallets = function () {
    var out = document.getElementById('wallets-output');
    if (!out) return;
    out.innerHTML = '<div class="card"><div class="empty">⏳ جاري الجلب...</div></div>';

    fetch('/api/wallets/balances?key=' + encodeURIComponent(KEY), { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var ws = (data && data.wallets) || [];
        if (!ws.length) {
          out.innerHTML = '<div class="card"><div class="empty">لا بيانات</div></div>';
          return;
        }
        var html = '';
        for (var i = 0; i < ws.length; i++) {
          var w = ws[i];
          var title = w.network === 'TON' ? '💎 TON Network' : '🔵 Base Network';
          html += '<div class="card">';
          html += '<h2>' + title + '</h2>';
          html += '<div class="bal-row"><span class="bal-num">' + (w.balance || '0') + '</span><span class="bal-sym">' + (w.symbol || '') + '</span></div>';
          html += '<div class="addr-row">' + (w.address || '') + '</div>';
          html += '<button class="btn-copy" data-addr="' + (w.address || '') + '">📋 نسخ العنوان</button>';
          html += '</div>';
        }
        out.innerHTML = html;

        var btns = out.querySelectorAll('.btn-copy');
        for (var b = 0; b < btns.length; b++) {
          btns[b].onclick = copyHandler;
        }
      })
      .catch(function (e) {
        out.innerHTML = '<div class="card"><div class="error">❌ ' + e.message + '</div></div>';
      });
  };

  // عند فتح تاب المحافظ → حمّل تلقائياً (capture لكي لا يمنعه dashboard.js)
  document.addEventListener('click', function (ev) {
    var el = ev.target;
    while (el && el !== document.body) {
      if (el.getAttribute && el.getAttribute('data-tab') === 'wallets') {
        setTimeout(window.__loadWallets, 200);
        return;
      }
      el = el.parentElement;
    }
  }, true);
})();
</script>
</body>
</html>
