<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>عمالقة الصمت</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, Tahoma, sans-serif; background: #0a1020; color: #e8ecf5; padding: 16px; min-height: 100vh; }
  h1 { color: #a78bfa; text-align: center; margin-bottom: 16px; }
  .tabs { display: flex; gap: 6px; justify-content: center; margin-bottom: 16px; flex-wrap: wrap; }
  .tab { padding: 10px 14px; background: #1e293b; color: #cbd5e1; border: 2px solid transparent; border-radius: 10px; cursor: pointer; font-size: 13px; }
  .tab.active { background: #312e81; color: #fff; border-color: #a78bfa; }
  .card { background: #1e293b; border-radius: 14px; padding: 16px; margin-bottom: 14px; border: 1px solid #334155; }
  .card h2 { color: #a78bfa; font-size: 15px; margin-bottom: 10px; }
  pre { background: #0f172a; padding: 12px; border-radius: 8px; overflow: auto; font-size: 11px; color: #a5b4fc; line-height: 1.6; }
  .err { color: #f87171; padding: 10px; background: #7f1d1d; border-radius: 8px; }
  .ok { color: #4ade80; }
  .addr { background: #0f172a; padding: 10px; border-radius: 8px; font-family: monospace; font-size: 11px; word-break: break-all; color: #a5b4fc; margin: 8px 0; }
  button.action { padding: 12px; width: 100%; background: #312e81; color: #fff; border: none; border-radius: 10px; font-size: 14px; cursor: pointer; }
</style>
</head>
<body>
<h1>⚡ عمالقة الصمت</h1>

<div class="tabs">
  <button class="tab active" data-t="main">الرئيسية</button>
  <button class="tab" data-t="wallets">💼 المحافظ</button>
  <button class="tab" data-t="team">الفريق</button>
</div>

<div id="view"></div>

<script>
var KEY = '8cdQ7WY9SvAGxe6SfFPlngj0_UbX6Cr';
var view = document.getElementById('view');

function q(p) { return p + (p.indexOf('?') === -1 ? '?' : '&') + 'key=' + encodeURIComponent(KEY); }

function renderMain() {
  view.innerHTML = '<div class="card"><h2>حالة النظام</h2><div id="out">⏳ جاري التحميل...</div></div>';
  fetch(q('/api/dashboard'))
    .then(function(r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function(d) {
      document.getElementById('out').innerHTML = '<span class="ok">✅ يعمل</span><pre>' + JSON.stringify(d.system || d, null, 2).slice(0, 800) + '</pre>';
    })
    .catch(function(e) {
      document.getElementById('out').innerHTML = '<div class="err">❌ ' + e.message + '</div>';
    });
}

function renderWallets() {
  view.innerHTML = '<div class="card"><h2>💼 المحافظ</h2><button class="action" id="rf">🔄 تحديث الأرصدة</button><div id="out" style="margin-top:10px;"></div></div>';
  document.getElementById('rf').onclick = loadWallets;
  loadWallets();
}

function loadWallets() {
  var out = document.getElementById('out');
  out.innerHTML = '⏳ جاري الجلب...';
  fetch(q('/api/wallets/balances'))
    .then(function(r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function(d) {
      var ws = d.wallets || [];
      if (!ws.length) { out.innerHTML = 'لا بيانات'; return; }
      var html = '';
      for (var i = 0; i < ws.length; i++) {
        var w = ws[i];
        html += '<div style="border-top:1px solid #334155; padding-top:10px; margin-top:10px;">';
        html += '<h2>' + (w.network === 'TON' ? '💎 TON' : '🔵 Base') + '</h2>';
        html += '<div style="font-size:28px; font-weight:800; color:#4ade80; text-align:center; padding:10px;">' + w.balance + ' ' + w.symbol + '</div>';
        html += '<div style="color:#94a3b8; font-size:12px; text-align:center;">' + w.native + ': ' + w.nativeBalance + '</div>';
        html += '<div class="addr">' + w.address + '</div>';
        if (w.note) html += '<div style="color:#fbbf24; font-size:11px; text-align:center;">' + w.note + '</div>';
        html += '</div>';
      }
      out.innerHTML = html;
    })
    .catch(function(e) {
      out.innerHTML = '<div class="err">❌ ' + e.message + '</div>';
    });
}

function renderTeam() {
  view.innerHTML = '<div class="card"><h2>الفريق</h2><textarea id="b" style="width:100%;min-height:120px;background:#0f172a;color:#e0e7ff;border:1px solid #334155;border-radius:8px;padding:10px;font-size:14px;"></textarea><button class="action" id="sb" style="margin-top:10px;">📤 إرسال</button><div id="st" style="margin-top:10px;text-align:center;font-size:12px;color:#94a3b8;"></div></div>';
  document.getElementById('sb').onclick = function() {
    var body = document.getElementById('b').value.trim();
    if (!body) return;
    document.getElementById('st').textContent = '⏳ إرسال...';
    fetch(q('/api/team/messages'), {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ sender: 'leader', recipient: 'all', thread: 'team', body: body })
    })
    .then(function(r) { return r.json(); })
    .then(function() {
      document.getElementById('st').textContent = '✅ تم';
      document.getElementById('b').value = '';
    })
    .catch(function(e) { document.getElementById('st').textContent = '❌ ' + e.message; });
  };
}

document.querySelectorAll('.tab').forEach(function(t) {
  t.onclick = function() {
    document.querySelectorAll('.tab').forEach(function(x) { x.classList.remove('active'); });
    t.classList.add('active');
    var n = t.getAttribute('data-t');
    if (n === 'main') renderMain();
    else if (n === 'wallets') renderWallets();
    else if (n === 'team') renderTeam();
  };
});

renderMain();
</script>
</body>
</html>
