<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>عمالقة الصمت — لوحة التحكم</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, 'Segoe UI', Tahoma, sans-serif; background: #0a1020; color: #e8ecf5; min-height: 100vh; padding: 16px; }
  header { text-align: center; margin-bottom: 24px; padding: 16px; }
  header h1 { font-size: 24px; color: #a78bfa; margin-bottom: 8px; }
  header p { color: #94a3b8; font-size: 13px; }
  .tabs { display: flex; gap: 8px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
  .tab { padding: 10px 18px; background: #1e293b; border-radius: 12px; color: #cbd5e1; cursor: pointer; border: 2px solid transparent; font-size: 14px; font-weight: 500; }
  .tab.active { background: #312e81; color: #e0e7ff; border-color: #a78bfa; }
  .panel { display: none; }
  .panel.active { display: block; }
  .card { background: #1e293b; border-radius: 16px; padding: 20px; margin-bottom: 16px; border: 1px solid #334155; }
  .card h2 { color: #a78bfa; font-size: 17px; margin-bottom: 12px; }
  .stat { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #334155; }
  .stat:last-child { border-bottom: none; }
  .stat .label { color: #94a3b8; }
  .stat .value { color: #e0e7ff; font-weight: 600; }
  .item { padding: 12px; background: #0f172a; border-radius: 10px; margin-bottom: 8px; }
  .item .meta { color: #a78bfa; font-size: 12px; margin-bottom: 6px; }
  .item .body { color: #e0e7ff; font-size: 14px; line-height: 1.5; }
  .empty { text-align: center; padding: 30px; color: #64748b; }
  .error { background: #7f1d1d; padding: 16px; border-radius: 12px; color: #fecaca; margin-bottom: 16px; font-size: 13px; }
  .ok { color: #4ade80; } .warn { color: #fbbf24; } .bad { color: #f87171; }
  .reload { display: block; width: 100%; padding: 14px; background: #312e81; color: #e0e7ff; border: none; border-radius: 12px; font-size: 16px; cursor: pointer; margin-top: 16px; font-weight: 600; }
</style>
</head>
<body>
<header>
  <h1>⚡ عمالقة الصمت</h1>
  <p>لوحة تحكم الفريق — Silent Giants</p>
</header>

<div id="error" class="error" style="display:none"></div>

<div class="tabs">
  <div class="tab active" data-tab="main">الرئيسية</div>
  <div class="tab" data-tab="team">غرفة الفريق</div>
  <div class="tab" data-tab="tasks">المهام</div>
  <div class="tab" data-tab="notifications">الإشعارات</div>
</div>

<div class="panel active" id="panel-main">
  <div class="card">
    <h2>📊 حالة النظام</h2>
    <div id="system-stats">جاري التحميل...</div>
  </div>
  <div class="card">
    <h2>👥 الوكلاء</h2>
    <div id="agents-list">جاري التحميل...</div>
  </div>
</div>

<div class="panel" id="panel-team">
  <div class="card">
    <h2>📤 إرسال رسالة للفريق</h2>
    <div style="margin-bottom: 10px;">
      <label style="color:#94a3b8; font-size:13px; display:block; margin-bottom:6px;">إلى:</label>
      <select id="msg-recipient" style="width:100%; padding:10px; background:#0f172a; color:#e0e7ff; border:1px solid #334155; border-radius:10px; font-size:14px;">
        <option value="all">الفريق الكامل</option>
        <option value="aurora">أورورا (المنسق)</option>
        <option value="planner">المخطط</option>
        <option value="executor">المنفذ</option>
        <option value="reviewer">المراجع</option>
        <option value="scout">المستخبر</option>
      </select>
    </div>
    <textarea id="msg-body" placeholder="اكتب الأمر أو الرسالة..." style="width:100%; min-height:100px; padding:12px; background:#0f172a; color:#e0e7ff; border:1px solid #334155; border-radius:10px; font-size:14px; font-family:inherit; resize:vertical;"></textarea>
    <button id="send-btn" style="display:block; width:100%; padding:12px; background:#312e81; color:#e0e7ff; border:none; border-radius:10px; font-size:15px; cursor:pointer; margin-top:10px; font-weight:600;">📤 إرسال</button>
    <div id="send-status" style="text-align:center; margin-top:10px; font-size:13px; color:#94a3b8;"></div>
  </div>
  <div class="card">
    <h2>💬 الرسائل السابقة</h2>
    <div id="messages-list">جاري التحميل...</div>
  </div>
</div>

<div class="panel" id="panel-tasks">
  <div class="card">
    <h2>📋 المهام النشطة</h2>
    <div id="tasks-list">جاري التحميل...</div>
  </div>
</div>

<div class="panel" id="panel-notifications">
  <div class="card">
    <h2>🔔 الإشعارات</h2>
    <div id="notifications-list">جاري التحميل...</div>
  </div>
</div>

<button id="refresh-btn" class="reload">🔄 تحديث البيانات</button>

<script src="/dashboard.js?v=20260919"></script>
</body>
</html>
