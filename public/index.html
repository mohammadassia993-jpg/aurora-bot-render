<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>عمالقة الصمت — لوحة التحكم</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, 'Segoe UI', Tahoma, sans-serif; background: #0a1020; color: #e8ecf5; min-height: 100vh; padding: 16px; }
  header { text-align: center; margin-bottom: 24px; padding: 16px; }
  header h1 { font-size: 24px; color: #a78bfa; margin-bottom: 8px; }
  header p { color: #94a3b8; font-size: 13px; }
  .tabs { display: flex; gap: 8px; justify-content: center; margin-bottom: 20px; flex-wrap: wrap; }
  .tab { padding: 10px 18px; background: #1e293b; border-radius: 12px; color: #cbd5e1; cursor: pointer; border: 2px solid transparent; font-size: 14px; font-weight: 500; }
  .tab.active { background: #312e81; color: #e0e7ff; border-color: #a78bfa; }
  .panel { display: none; }
  .panel.active { display: block; }
  .card { background: #1e293b; border-radius: 16px; padding: 20px; margin-bottom: 16px; border: 1px solid #334155; }
  .card h2 { color: #a78bfa; font-size: 17px; margin-bottom: 12px; }
  .stat { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #334155; }
  .stat:last-child { border-bottom: none; }
  .stat .label { color: #94a3b8; }
  .stat .value { color: #e0e7ff; font-weight: 600; }
  .item { padding: 12px; background: #0f172a; border-radius: 10px; margin-bottom: 8px; }
  .item .meta { color: #a78bfa; font-size: 12px; margin-bottom: 6px; }
  .item .body { color: #e0e7ff; font-size: 14px; line-height: 1.5; }
  .empty { text-align: center; padding: 30px; color: #64748b; }
  .error { background: #7f1d1d; padding: 16px; border-radius: 12px; color: #fecaca; margin-bottom: 16px; font-size: 13px; }
  .ok { color: #4ade80; } .warn { color: #fbbf24; } .bad { color: #f87171; }
  .reload { display: block; width: 100%; padding: 14px; background: #312e81; color: #e0e7ff; border: none; border-radius: 12px; font-size: 16px; cursor: pointer; margin-top: 16px; font-weight: 600; }
</style>
</head>
<body>
<header>
  <h1>⚡ عمالقة الصمت</h1>
  <p>لوحة تحكم الفريق — Silent Giants</p>
</header>

<div id="error" class="error" style="display:none"></div>

<div class="tabs">
  <div class="tab active" data-tab="main">الرئيسية</div>
  <div class="tab" data-tab="team">غرفة الفريق</div>
  <div class="tab" data-tab="tasks">المهام</div>
  <div class="tab" data-tab="notifications">الإشعارات</div>
</div>

<div class="panel active" id="panel-main">
  <div class="card">
    <h2>📊 حالة النظام</h2>
    <div id="system-stats">جاري التحميل...</div>
  </div>
  <div class="card">
    <h2>👥 الوكلاء</h2>
    <div id="agents-list">جاري التحميل...</div>
  </div>
</div>

<div class="panel" id="panel-team">
  <div class="card">
    <h2>💬 رسائل الفريق</h2>
    <div id="messages-list">جاري التحميل...</div>
  </div>
</div>

<div class="panel" id="panel-tasks">
  <div class="card">
    <h2>📋 المهام النشطة</h2>
    <div id="tasks-list">جاري التحميل...</div>
  </div>
</div>

<div class="panel" id="panel-notifications">
  <div class="card">
    <h2>🔔 الإشعارات</h2>
    <div id="notifications-list">جاري التحميل...</div>
  </div>
</div>

<button class="reload" onclick="loadAll()">🔄 تحديث البيانات</button>

<script>
const params = new URLSearchParams(location.search);
const key = params.get('key') || localStorage.getItem('teamKey') || '';
if (key) localStorage.setItem('teamKey', key);
const headers = { 'x-team-key': key };
const errorBox = document.getElementById('error');

function showError(msg) { errorBox.textContent = msg; errorBox.style.display = 'block'; }

async function fetchJson(path) {
  const res = await fetch(path, { headers });
  if (!res.ok) throw new Error(`${res.status}`);
  return await res.json();
}

document.querySelectorAll('.tab').forEach(tab => {
  tab.onclick = () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('panel-' + tab.dataset.tab).classList.add('active');
  };
});

async function loadSystem() {
  try {
    const data = await fetchJson('/api/dashboard');
    const fin = data.finance || {};
    document.getElementById('system-stats').innerHTML = `
      <div class="stat"><span class="label">الحالة</span><span class="value ok">● نشط</span></div>
      <div class="stat"><span class="label">المشاريع</span><span class="value">${(data.projects || []).length}</span></div>
      <div class="stat"><span class="label">الرصيد</span><span class="value">${fin.balance || 0} ${fin.currency || 'USD'}</span></div>
    `;
  } catch (e) {
    document.getElementById('system-stats').innerHTML = '<div class="empty">تعذّر التحميل</div>';
  }
}

async function loadAgents() {
  try {
    const data = await fetchJson('/api/team/agents');
    const agents = data.agents || [];
    document.getElementById('agents-list').innerHTML = agents.length
      ? agents.map(a => `<div class="stat"><span class="label">${a.name || a.id}</span><span class="value ${a.status === 'active' ? 'ok' : 'warn'}">${a.status || 'idle'}</span></div>`).join('')
      : '<div class="empty">لا يوجد وكلاء</div>';
  } catch (e) {
    document.getElementById('agents-list').innerHTML = '<div class="empty">تعذّر التحميل</div>';
  }
}

async function loadMessages() {
  try {
    const data = await fetchJson('/api/team/messages');
    const msgs = data.messages || [];
    document.getElementById('messages-list').innerHTML = msgs.length
      ? msgs.slice(0, 30).map(m => `<div class="item"><div class="meta">${m.sender || '?'} → ${m.recipient || 'all'}</div><div class="body">${(m.body || '').slice(0, 300)}</div></div>`).join('')
      : '<div class="empty">لا توجد رسائل</div>';
  } catch (e) {
    document.getElementById('messages-list').innerHTML = '<div class="empty">تعذّر التحميل</div>';
  }
}

async function loadTasks() {
  try {
    const data = await fetchJson('/api/team/tasks');
    const tasks = data.tasks || [];
    document.getElementById('tasks-list').innerHTML = tasks.length
      ? tasks.slice(0, 30).map(t => `<div class="item"><div class="meta">${t.source || ''} • ${t.status || ''}</div><div class="body">${t.title || ''}</div>${t.reward ? `<div class="ok" style="font-size:13px;margin-top:6px">💰 ${t.reward} ${t.currency || ''}</div>` : ''}</div>`).join('')
      : '<div class="empty">لا توجد مهام</div>';
  } catch (e) {
    document.getElementById('tasks-list').innerHTML = '<div class="empty">تعذّر التحميل</div>';
  }
}

async function loadNotifications() {
  try {
    const data = await fetchJson('/api/notifications');
    const notifs = data.notifications || [];
    document.getElementById('notifications-list').innerHTML = notifs.length
      ? notifs.slice(0, 30).map(n => `<div class="item"><div class="meta">${n.kind || ''}</div><div class="body">${n.title || ''}</div><div style="color:#94a3b8;font-size:13px;margin-top:4px">${(n.body || '').slice(0, 200)}</div></div>`).join('')
      : '<div class="empty">لا توجد إشعارات</div>';
  } catch (e) {
    document.getElementById('notifications-list').innerHTML = '<div class="empty">تعذّر التحميل</div>';
  }
}

async function loadAll() {
  errorBox.style.display = 'none';
  await Promise.all([loadSystem(), loadAgents(), loadMessages(), loadTasks(), loadNotifications()]);
}

if (!key) showError('⚠️ أضف ?key=... إلى الرابط لتفعيل لوحة التحكم');
else loadAll();
</script>
</body>
</html>
