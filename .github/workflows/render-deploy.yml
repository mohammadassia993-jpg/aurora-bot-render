name: Deploy to Render
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Render
        uses: andrecr12/render-blueprint-deploy@main
        with:
          api-key: ${{ secrets.RENDER_API_KEY }}
          blueprint-file: render.yaml
      - name: Check health
        run: sleep 60 && curl -sf https://silent-giants-primary.onrender.com/health
